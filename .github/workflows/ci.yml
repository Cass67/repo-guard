name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  SHFMT_VERSION: 3.14.1
  SHFMT_SHA256: 76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf
  ACTIONLINT_VERSION: 1.7.7
  OSV_SCANNER_VERSION: 2.5.1

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: python -m pip install --upgrade pip pre-commit ruff==0.15.2 zizmor==1.31.1 semgrep==1.176.0

      - name: Install CLI deps (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck ripgrep
          # apt's shfmt formats differently from current releases; pin upstream.
          curl -sSfLo shfmt "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64"
          echo "${SHFMT_SHA256}  shfmt" | sha256sum -c -
          sudo install -m 0755 shfmt /usr/local/bin/shfmt
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$tarball"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $tarball\$" | sha256sum -c -
          sudo tar -xzf "$tarball" -C /usr/local/bin gitleaks
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfLO "$base/$tarball"
          curl -sSfL "$base/actionlint_${ACTIONLINT_VERSION}_checksums.txt" | grep " $tarball\$" | sha256sum -c -
          sudo tar -xzf "$tarball" -C /usr/local/bin actionlint
          base="https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}"
          curl -sSfLO "$base/osv-scanner_linux_amd64"
          curl -sSfL "$base/osv-scanner_SHA256SUMS" | grep " osv-scanner_linux_amd64\$" | sha256sum -c -
          sudo install -m 0755 osv-scanner_linux_amd64 /usr/local/bin/osv-scanner

      - name: Install CLI deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install shellcheck ripgrep shfmt gitleaks
          # Same pinned, checksum-verified releases as Linux, so both test one version.
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          tarball="actionlint_${ACTIONLINT_VERSION}_darwin_arm64.tar.gz"
          curl -sSfLO "$base/$tarball"
          curl -sSfL "$base/actionlint_${ACTIONLINT_VERSION}_checksums.txt" | grep " $tarball\$" | shasum -a 256 -c -
          sudo tar -xzf "$tarball" -C /usr/local/bin actionlint
          base="https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}"
          curl -sSfLO "$base/osv-scanner_darwin_arm64"
          curl -sSfL "$base/osv-scanner_SHA256SUMS" | grep " osv-scanner_darwin_arm64\$" | shasum -a 256 -c -
          sudo install -m 0755 osv-scanner_darwin_arm64 /usr/local/bin/osv-scanner

      - name: Shellcheck
        run: shellcheck bin/repo-guard tests/*.sh

      - name: shfmt
        run: shfmt -i 2 -ci -d bin/repo-guard tests/*.sh

      - name: Ruff
        run: ruff check --select E,F,W,B bin/repo_guard_runtime.py && ruff format --check bin/repo_guard_runtime.py

      - name: Smoke test
        run: ./tests/smoke.sh

      - name: Detect test
        run: ./tests/detect.sh

      - name: Language matrix test
        run: ./tests/language-matrix.sh

      - name: Run-mode test
        run: ./tests/run.sh
