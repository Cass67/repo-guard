name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: python -m pip install --upgrade pip pre-commit ruff

      - name: Install CLI deps (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck ripgrep shfmt
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$tarball"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $tarball\$" | sha256sum -c -
          sudo tar -xzf "$tarball" -C /usr/local/bin gitleaks

      - name: Install CLI deps (macOS)
        if: runner.os == 'macOS'
        run: brew install shellcheck ripgrep shfmt gitleaks

      - name: Shellcheck
        run: shellcheck bin/repo-guard tests/*.sh

      - name: shfmt
        run: shfmt -i 2 -ci -d bin/repo-guard tests/*.sh

      - name: Ruff
        run: ruff check --select E,F,W,B bin/repo_guard_runtime.py && ruff format --check bin/repo_guard_runtime.py

      - name: Smoke test
        run: ./tests/smoke.sh

      - name: Detect test
        run: ./tests/detect.sh

      - name: Language matrix test
        run: ./tests/language-matrix.sh

      - name: Run-mode test
        run: ./tests/run.sh
